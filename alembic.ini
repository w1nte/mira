# Alembic configuration for development (creating new migration revisions).
# End users run `vision-tagger migrate` instead. See CLAUDE.md -> "Database migrations".
#
#   uv run alembic -x db=sqlite:///.scratch/schema.sqlite3 upgrade head
#   uv run alembic -x db=sqlite:///.scratch/schema.sqlite3 revision --autogenerate -m "describe change"

[alembic]
script_location = src/vision_tagger/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s

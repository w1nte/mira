# Mira (remote mode) with Ollama for the vision model.
#
#   1. cp .env.example .env (Windows: copy .env.example .env) and set the password in it
#   2. docker compose up -d
#   3. open http://<server>:8765 and upload photos on the Import page
#   4. the ollama service downloads the AI models when Mira needs them ("Download now" on
#      Home, or the first run); by hand: docker compose exec ollama ollama pull qwen2.5vl:7b
#
# For access from the internet and "Install app" on phones, use HTTPS: docker-compose.traefik.yml
# adds Traefik with a free Let's Encrypt certificate for your domain (see docs/remote.md).
services:
  mira:
    build:
      context: .
      args:
        EXTRA: cpu # gpu: NVIDIA GPU, then also uncomment the deploy section below
    image: mira:latest
    ports:
      - "8765:8765"
    environment:
      VT_WEB__PASSWORD: ${VT_PASSWORD:?set VT_PASSWORD in the .env file (see .env.example)}
    volumes:
      - vt-data:/data # database, thumbnails, face crops, models
      - vt-photos:/photos # the uploaded photos (a host folder works too: ./photos:/photos)
    depends_on:
      - ollama
    restart: unless-stopped
    # a running pipeline is paused on shutdown and continues on the next start;
    # the extra time lets the current image finish
    stop_grace_period: 2m
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  vt-data:
  vt-photos:
  ollama:

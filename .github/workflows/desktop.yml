name: Desktop apps

# Builds the desktop app with PyInstaller (packaging/vision-tagger.spec), checks it with its
# self-test and packs it:
#
#   Windows  Mira-setup-<version>-<flavor>.exe (one file)                Inno Setup
#   Linux    Mira-<version>-linux-x86_64-<flavor>.tar.gz (or .partNN)    with install.sh
#   macOS    Mira-<version>-macos-arm64.pkg (Apple silicon, cpu)          pkgbuild/productbuild
#
#   cpu: runs everywhere; gpu: NVIDIA GPU, with CUDA and cuDNN (driver R580 or newer)
#
# Publishing a GitHub release (tag v1.2.3, v1.2.3-rc.1, ...; drafts don't count, pre-releases
# do) builds everything with the tag as the version and attaches the files to the release. A
# release published without notes gets the changelog's section for its tag as notes
# (packaging/changelog.py; src/vision_tagger/resources/CHANGELOG.md).
# Manual runs and the quick checks on pushes to main and on pull requests (cpu builds) keep the
# files as workflow artifacts. packaging/plan.py decides which builds run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [all, windows, linux, macos]
        default: all
      flavor:
        description: Flavour (macOS has cpu only)
        type: choice
        options: [both, cpu, gpu]
        default: both
  push:
    branches: [main]
    paths:
      - packaging/**
      - src/vision_tagger/desktop.py
      - src/vision_tagger/cli.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packaging/**
      - src/vision_tagger/desktop.py
      - src/vision_tagger/cli.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Which builds
        id: plan
        shell: bash  # with pipefail: a refused choice fails here
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          python3 packaging/plan.py --event "$EVENT" --platform "${PLATFORM:-all}" \
            --flavor "${FLAVOR:-both}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name }}
      FLAVOR: ${{ matrix.flavor }}
      CLI: ${{ matrix.cli }}
      NAME: ${{ matrix.name }}
      # macOS: insightface is compiled here; the bundled wheels need macOS 15 anyway
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # insightface is compiled from source and its wheel lands in uv's cache. The cache key
          # names the OS family but not its version, so without the suffix a wheel built by
          # ci.yml on ubuntu-latest (newer libstdc++) was bundled into the ubuntu-22.04 build,
          # which then failed: GLIBCXX_3.4.32 not found. Releases build without any cache.
          enable-cache: ${{ github.event_name != 'release' }}
          cache-suffix: desktop-${{ matrix.runner }}
          python-version: "3.12"

      - name: The lock file is up to date
        run: uv lock --check

      - name: Version (the release tag, else pyproject.toml)
        id: version
        run: |
          if [ -n "$TAG" ]; then
            version=$(uv run --no-project python packaging/version.py "$TAG")
          else
            version=$(uv run --no-project python packaging/version.py --current)
          fi
          version=${version%$'\r'}  # Windows line end
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Mira $version ($NAME)" >> "$GITHUB_STEP_SUMMARY"

      - name: Changelog section for the release
        # The app shows its own version's changes on "What's new". When the release step of
        # CLAUDE.md ("Changelog") was forgotten, the entries are still under Unreleased: file
        # them under the tag in this build (main gets the same change by a pull request, see
        # the publish job). Before the install, which copies the package into the venv.
        if: env.TAG != ''
        run: uv run --no-project python packaging/changelog.py release "$TAG"

      - name: Free disk space (Linux gpu)
        # the CUDA libraries are in the venv, the app folder and the archive
        if: runner.os == 'Linux' && matrix.flavor == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the app and PyInstaller
        run: uv sync --frozen --no-dev --no-editable --extra "$FLAVOR" --extra desktop --group packaging

      - name: Build the app
        run: uv run --no-sync pyinstaller packaging/vision-tagger.spec --noconfirm --clean

      - name: Self-test of the built app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$CLI" self-test | tee self-test.log
          # the first line names the version (CR: Windows line ends)
          if ! tr -d '\r' < self-test.log | grep -qx "Mira $VERSION"; then
            echo "::error::the built app is not version $VERSION"
            exit 1
          fi
          # the commands the installers use; without a library they do nothing
          "$CLI" quit-app
          "$CLI" migrate --desktop

      - name: Setup program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $common = @("/DAppVersion=$env:VERSION", "/DFlavor=$env:FLAVOR")
          if ($env:TAG) { $common += "/DReleaseTag=$env:TAG" }
          # one setup file; the gpu flavour compresses to about 285 MB
          $out = & $iscc @common packaging\windows\installer.iss 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0 -and ($out -join "`n") -match 'Disk spanning must be enabled') {
            # over Inno's single-file limit: split into .bin files. A first pass counts them, so
            # the setup knows which ones to download when it is started without them.
            $probe = Join-Path $env:RUNNER_TEMP "slices"
            & $iscc @common /DSpanning "/O$probe" packaging\windows\installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $slices = (Get-ChildItem $probe -Filter "*.bin").Count
            Write-Output "split into $slices .bin file(s)"
            & $iscc @common /DSpanning "/DSlices=$slices" packaging\windows\installer.iss
            $code = $LASTEXITCODE
          }
          if ($code -ne 0) { exit $code }

      - name: Split setup variant compiles (check only)
        # the code that downloads missing .bin files only runs in a split setup, which today's
        # builds don't need; compile it here so it can't break unnoticed
        if: runner.os == 'Windows' && matrix.flavor == 'cpu' && github.event_name != 'release'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $check = Join-Path $env:RUNNER_TEMP "split-check"
          & $iscc /DAppVersion=$env:VERSION /DFlavor=cpu /DSpanning /DSlices=1 /DReleaseTag=check "/O$check" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $check | Format-Table Name, Length

      - name: Archive with install.sh (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/linux/build_tarball.sh "$VERSION" "$FLAVOR"

      - name: Installer package (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/macos/build_pkg.sh "$VERSION"

      - name: Files
        working-directory: dist/installer
        run: |
          for f in *; do
            echo "- $f: $(wc -c < "$f") bytes"
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Mira-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: dist/installer/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Attach to the release
    # also after a failed build: attach what was built (re-running the failed job adds the rest)
    if: github.event_name == 'release' && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write  # the changelog pull request for main (see below)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Changelog section for the release
        # as in the builds: Unreleased filed under the tag when the release step was forgotten
        continue-on-error: true  # never keeps the files from being attached
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp src/vision_tagger/resources/CHANGELOG.md "$RUNNER_TEMP/released-changelog.md"
          python3 packaging/changelog.py release "$TAG"
      - name: Release notes from the changelog (only if the release has none)
        # Notes written on GitHub stay as they are. A problem here never keeps the files from
        # being attached, hence continue-on-error.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body // ""')
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "The release has notes; they stay as they are."
            exit 0
          fi
          # the section of the tag, else Unreleased (with a warning); empty if neither has any
          python3 packaging/changelog.py notes "$TAG" > notes.md
          if [ ! -s notes.md ]; then
            echo "No notes in the changelog for $TAG; the release stays without notes."
            exit 0
          fi
          cat notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Changelog for main (pull request, when the release step was forgotten)
        # Moves the entries that were under Unreleased in the released commit into the tag's
        # section on main; entries added to main since stay Unreleased. Through the API, so the
        # checkout keeps no credentials. Creating the pull request needs "Allow GitHub Actions
        # to create and approve pull requests" (Settings → Actions → General); without it the
        # branch is still pushed and the log says so.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          FILE: src/vision_tagger/resources/CHANGELOG.md
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$main_sha" > main.json
          jq -r .content main.json | base64 -d > main-changelog.md
          file_sha=$(jq -r .sha main.json)
          cp main-changelog.md before.md
          python3 packaging/changelog.py --file main-changelog.md release "$TAG" \
            --entries-from "$RUNNER_TEMP/released-changelog.md"
          if cmp -s before.md main-changelog.md; then
            echo "main's changelog already has the section for $TAG."
            exit 0
          fi
          branch="changelog/release-$TAG"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" \
            -f "sha=$main_sha" > /dev/null || echo "branch $branch exists already"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f "message=Changelog: release $TAG" -f "branch=$branch" -f "sha=$file_sha" \
            -f "content=$(base64 -w0 main-changelog.md)" > /dev/null
          body="The release $TAG was published while its changes were still under Unreleased."
          body="$body This files them under \`## $TAG\` (CLAUDE.md, Changelog, release step 1)."
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Changelog: release $TAG" --body "$body"; then
            echo "::warning title=Changelog::Branch $branch has the changelog for $TAG; merge it into main (Actions may not create pull requests here)."
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: Mira-*
          path: files
          merge-multiple: true
      - name: Upload the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l files
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
